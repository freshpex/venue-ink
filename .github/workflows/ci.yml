name: Platform verification
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:local
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:local -- --e2e --project=chromium
      - run: npm run test:local -- --e2e --project=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-browser-evidence
          path: |
            artifacts/qa/
            test-results/
          retention-days: 14
